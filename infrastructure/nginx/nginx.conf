# MRMS Nginx reverse proxy (baseline).
# Terminates client traffic and proxies to the API + WebSocket gateway, and
# serves the built SPAs. TLS is added at deployment (Phase P8); this baseline
# listens on HTTP:80 for local/compose use.
#
# INITIALIZATION SKELETON: upstream app services are referenced but only become
# reachable once the backend/web images run application code (Sprint 1+).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

  # Structured-ish access log; production adds JSON format + shipping.
  log_format main '$remote_addr - $remote_user [$time_iso8601] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # Upstreams (resolved when the containers are running).
  upstream mrms_api {
    server api:3000;
  }

  # WebSocket upgrade support.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # --- Static SPAs (served from this image once built) ---
    root /usr/share/nginx/html;
    index index.html;

    # Display kiosk app (built output mounted at /display in Sprint 5+).
    location /display/ {
      try_files $uri $uri/ /display/index.html;
    }

    # Admin app (built output mounted at /admin in Sprint 10+).
    location /admin/ {
      try_files $uri $uri/ /admin/index.html;
    }

    # --- REST API ---
    location /api/ {
      proxy_pass         http://mrms_api;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- WebSocket (Socket.IO realtime gateway) ---
    location /realtime/ {
      proxy_pass         http://mrms_api;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }

    # --- Health ---
    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
