name: Docker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, "release/**"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Validate that the Dockerfiles build. Images are NOT pushed here;
      # publishing to a registry is configured during deployment (Phase P8).
      # During initialization the Dockerfiles are infrastructure-only skeletons.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: false
          tags: mrms/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: false
          load: false
          tags: mrms/worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          load: false
          tags: mrms/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
