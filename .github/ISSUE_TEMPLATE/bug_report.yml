name: "\U0001F41B Bug Report"
description: Report a defect or unexpected behavior in MRMS.
title: "fix: <short description of the bug>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much
        detail as possible so we can reproduce and fix the issue quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
      placeholder: When I click "Book Now" on an available room, ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Observe '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include error messages / stack traces).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the system is affected?
      options:
        - Backend / API
        - Display (Kiosk)
        - Admin Panel
        - Google Calendar Sync
        - Google Meet / Zoom
        - Authentication
        - Realtime / WebSocket
        - Device Monitoring
        - Analytics
        - Deployment / Infrastructure
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, backend version/commit, site/room if relevant.
      placeholder: Windows 11, Chrome 126 kiosk, backend v0.1.0, BB-Aula
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Relevant logs, screenshots, or correlation IDs. Do NOT paste secrets.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (production down / data loss)
        - High (major feature broken)
        - Medium (feature partially broken)
        - Low (minor / cosmetic)
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I did not include any secrets, tokens, or personal data.
          required: true
