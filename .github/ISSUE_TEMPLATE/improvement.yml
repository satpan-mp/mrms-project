name: "\U0001F527 Improvement"
description: Enhance existing functionality, performance, or developer experience.
title: "refactor: <short description of the improvement>"
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current Situation
      description: What exists today and why it is suboptimal?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Proposed Improvement
      description: What should change and what benefit it brings.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Improvement Category
      options:
        - Performance
        - Code quality / Refactor
        - Developer experience
        - Accessibility
        - Security hardening
        - Observability / Logging
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Backend / API
        - Display (Kiosk)
        - Admin Panel
        - Google Calendar Sync
        - Google Meet / Zoom
        - Authentication
        - Realtime / WebSocket
        - Device Monitoring
        - Analytics
        - Deployment / Infrastructure
        - Other
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Expected Impact / Measurement
      description: How will we know the improvement worked (metric, benchmark)?
    validations:
      required: false
