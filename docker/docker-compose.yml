# MRMS base compose (infrastructure topology).
# Service graph: web (nginx) -> api (+ realtime); api + worker -> postgres + redis.
# A one-shot `migrate` service applies Prisma migrations before api/worker start.
#
# Usage:
#   Base only:  docker compose -f docker/docker-compose.yml up
#   Dev:        docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up
#   Prod:       docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
#
# DATABASE_URL / REDIS_URL are constructed here for the compose network
# (hosts `postgres` / `redis`), overriding the localhost values in .env.

name: mrms

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${DATABASE_USER:-mrms}:${DATABASE_PASSWORD:-mrms}@postgres:5432/${DATABASE_NAME:-mrms}?schema=public
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-mrms}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-mrms}
      POSTGRES_DB: ${DATABASE_NAME:-mrms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-mrms}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: apply Prisma migrations, then exit. api/worker wait for success.
  migrate:
    image: mrms/api:latest
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']

  api:
    image: mrms/api:latest
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      APP_PORT: '3000'
    expose:
      - '3000'

  worker:
    image: mrms/worker:latest
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *app-env

  web:
    image: mrms/web:latest
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_HTTP_PORT:-8080}:80'

volumes:
  pgdata:
  redisdata:
