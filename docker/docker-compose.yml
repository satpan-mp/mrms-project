# MRMS base compose (infrastructure topology).
# Defines the service graph: nginx -> api (+ realtime) / web, api+worker -> postgres+redis.
# Application images are initialization skeletons; app logic lands in Sprint 1+.
#
# Usage:
#   Base only:  docker compose -f docker/docker-compose.yml up
#   Dev:        docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up
#   Prod:       docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d

name: mrms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-mrms}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-mrms}
      POSTGRES_DB: ${DATABASE_NAME:-mrms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-mrms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: mrms/api:latest
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    expose:
      - "3000"

  worker:
    image: mrms/worker:latest
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

  web:
    image: mrms/web:latest
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_HTTP_PORT:-8080}:80"

volumes:
  pgdata:
  redisdata:
